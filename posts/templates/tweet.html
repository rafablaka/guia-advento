<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Print de tweet</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Cores do X (claro e "Lights out") */
  :root { --fundo: #F4F0F7; --card: #FFFFFF; --texto: #0F1419; --texto-2: #536471; --linha: #EFF3F4; --borda-card: transparent; }
  html[data-modo='escuro'] { --fundo: #1B1224; --card: #000000; --texto: #E7E9EA; --texto-2: #71767B; --linha: #2F3336; --borda-card: #2F3336; }

  body { background: var(--fundo); display: flex; align-items: center; justify-content: center; }
  .card {
    width: 459px; /* 918px (85%) com zoom 2 */
    zoom: 2;
    background: var(--card);
    color: var(--texto);
    border: 1px solid var(--borda-card);
    border-radius: 16px;
    padding: 16px 16px 6px;
    box-shadow: 0 2px 14px rgba(41, 24, 47, 0.06);
  }
  html[data-modo='escuro'] .card { box-shadow: none; }

  .topo { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: var(--roxo); color: #F7EEDC;
    display: flex; align-items: center; justify-content: center;
    font: 600 16px/1 'Fraunces', serif; letter-spacing: 0.02em;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .quem { flex: 1; min-width: 0; }
  .nome { display: flex; align-items: center; gap: 3px; font-weight: 700; font-size: 16px; line-height: 20px; }
  .nome svg { width: 19px; height: 19px; fill: var(--roxo); }
  .handle { color: var(--texto-2); font-size: 15px; line-height: 19px; }
  .mais { width: 19px; height: 19px; fill: var(--texto-2); align-self: flex-start; margin-top: 2px; }

  .texto { margin-top: 12px; font-size: 26px; line-height: 1.32; white-space: pre-wrap; overflow-wrap: anywhere; letter-spacing: -0.005em; }
  .meta { margin-top: 14px; color: var(--texto-2); font-size: 15px; line-height: 20px; }
  .meta b { color: var(--texto); font-weight: 700; }

  .acoes {
    margin-top: 14px; border-top: 1px solid var(--linha);
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px 6px;
  }
  .acao { display: flex; align-items: center; gap: 5px; color: var(--texto-2); font-size: 13.5px; }
  .acao svg { width: 21px; height: 21px; fill: var(--texto-2); }
</style>
</head>
<body data-template="tweet">
<div class="card" id="card"></div>
<div id="selo"></div>
<script src="base.js"></script>
<script>
  const ICONES = {
    verificado: 'M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z',
    mais: 'M3 12c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm9 2c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm7 0c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z',
    resposta: 'M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z',
    repost: 'M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 1.1.896 2 2 2H13v2H7.5c-2.209 0-4-1.79-4-4V7.55L1.432 9.48.068 8.02 4.5 3.88zM16.5 6H11V4h5.5c2.209 0 4 1.79 4 4v8.45l2.068-1.93 1.364 1.46-4.432 4.14-4.432-4.14 1.364-1.46 2.068 1.93V8c0-1.1-.896-2-2-2z',
    curtida: 'M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z',
    salvar: 'M4 4.5C4 3.12 5.119 2 6.5 2h11C18.881 2 20 3.12 20 4.5v18.44l-8-5.71-8 5.71V4.5zM6.5 4c-.276 0-.5.22-.5.5v14.56l6-4.29 6 4.29V4.5c0-.28-.224-.5-.5-.5h-11z',
    compartilhar: 'M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z',
  }
  const icone = (nome, classe = '') => `<svg viewBox="0 0 24 24" class="${classe}"><path d="${ICONES[nome]}"/></svg>`
  const acao = (nome, valor) => `<span class="acao">${icone(nome)}${valor ? esc(valor) : ''}</span>`

  window.render = (p, modo) => {
    const avatar = p.avatar ? `<img src="${img(p.avatar)}" alt="">` : esc(p.iniciais || iniciais(p.nome))
    document.getElementById('card').innerHTML = `
      <div class="topo">
        <div class="avatar">${avatar}</div>
        <div class="quem">
          <div class="nome"><span>${esc(p.nome)}</span>${icone('verificado')}</div>
          <div class="handle">${esc(p.handle)}</div>
        </div>
        ${icone('mais', 'mais')}
      </div>
      <div class="texto" id="texto">${esc(p.texto)}</div>
      <div class="meta">${esc(p.hora_data)}${p.views ? ` · <b>${esc(p.views)}</b> visualizações` : ''}</div>
      <div class="acoes">
        ${acao('resposta', p.respostas)}
        ${acao('repost', p.reposts)}
        ${acao('curtida', p.curtidas)}
        ${acao('salvar')}
        ${acao('compartilhar')}
      </div>`
    document.getElementById('selo').outerHTML = selo(modo === 'escuro' ? 'claro' : 'escuro')
  }

  // Texto longo: diminui a fonte até o card caber com folga para o selo.
  window.ajustar = () => {
    const card = document.getElementById('card')
    caberComFonte(document.getElementById('texto'), 26, 15, () => card.getBoundingClientRect().height <= 820)
  }
</script>
</body>
</html>
