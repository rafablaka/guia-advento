<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Notificação na tela de bloqueio</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Material das notificações do iOS: claro ou escuro */
  :root {
    --card: rgba(246, 244, 248, 0.62); --texto: #000; --texto-2: rgba(60, 60, 67, 0.62);
    --brilho: 0.68;
  }
  html[data-modo='escuro'] {
    --card: rgba(58, 44, 72, 0.6); --texto: #fff; --texto-2: rgba(235, 235, 245, 0.6);
    --brilho: 0.5;
  }

  body { background: #1B1224; }
  .fundo { position: absolute; inset: -80px; overflow: hidden; }
  .fundo img {
    position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; object-fit: cover;
    transform: translate(-50%, -46%);
    filter: url(#duotone) blur(24px) brightness(var(--brilho));
  }

  .grao { position: absolute; inset: 0; opacity: 0.16; mix-blend-mode: overlay; pointer-events: none; }
  .tela { position: relative; zoom: 2.5; width: 432px; height: 432px; color: #fff; overflow: hidden; }

  .status { height: 44px; padding: 14px 26px 0; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .status svg { fill: #fff; }

  .cadeado { display: flex; justify-content: center; margin-top: -6px; }
  .cadeado svg { width: 13px; height: 17px; fill: rgba(255, 255, 255, 0.9); }
  .data { margin-top: 8px; text-align: center; font-size: 19px; font-weight: 600; color: rgba(255, 255, 255, 0.88); letter-spacing: 0.005em; }
  .hora {
    text-align: center; font-family: var(--ios-display); font-weight: 600;
    font-size: 92px; line-height: 0.98; letter-spacing: -0.02em; color: rgba(255, 255, 255, 0.92);
  }

  .lista { margin-top: 18px; padding: 0 10px; display: flex; flex-direction: column; gap: 8px; }
  .notificacao {
    background: var(--card);
    -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
    border-radius: 22px; padding: 11px 14px 13px; color: var(--texto);
  }
  .cabeca { display: flex; align-items: center; gap: 7px; color: var(--texto-2); font-size: 12.5px; letter-spacing: 0.02em; }
  .cabeca .icone-guia { width: 20px; height: 20px; border-radius: 5px; }
  .cabeca .app { flex: 1; text-transform: uppercase; }
  .cabeca .tempo { letter-spacing: 0; }
  .titulo { margin-top: 7px; font-size: 15px; font-weight: 600; line-height: 1.25; }
  .corpo { font-size: 15px; line-height: 1.27; }
</style>
</head>
<body data-template="notificacao">
<div class="fundo"><img id="fundo" alt=""></div>
<svg class="grao" width="1080" height="1080"><filter id="ruido"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#ruido)"/></svg>
<div class="tela" id="tela">
  <div class="status">
    <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="5" y="5" width="3" height="6" rx=".8"/><rect x="10" y="2.5" width="3" height="8.5" rx=".8"/><rect x="15" y="0" width="3" height="11" rx=".8"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.3c2.2 0 4.2.9 5.7 2.3l1.1-1.1C13 1.7 10.6.7 8 .7S3 1.7 1.2 3.5l1.1 1.1C3.8 3.2 5.8 2.3 8 2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1C11.3 4.6 9.7 3.9 8 3.9s-3.3.7-4.5 1.8l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L8 10.4 6.8 9.2c.3-.3.7-.5 1.2-.5z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="rgba(255,255,255,.4)"/><rect x="2" y="2" width="16" height="9" rx="2.4"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="rgba(255,255,255,.4)"/></svg>
  </div>
  <div class="cadeado"><svg viewBox="0 0 13 17"><path d="M2 7V4.6C2 2.1 4 .2 6.5.2S11 2.1 11 4.6V7h.3c.9 0 1.5.7 1.5 1.5v6.8c0 .9-.7 1.5-1.5 1.5H1.7C.8 16.8.2 16.1.2 15.3V8.5C.2 7.6.9 7 1.7 7H2zm1.6 0h5.8V4.6c0-1.6-1.3-2.9-2.9-2.9S3.6 3 3.6 4.6V7z"/></svg></div>
  <div class="data" id="data"></div>
  <div class="hora" id="hora"></div>
  <div class="lista" id="lista"></div>
  <div style="height: 34px"></div>
</div>
<script src="base.js"></script>
<script>
  window.render = (p) => {
    document.getElementById('fundo').src = img(p.wallpaper || '../public/illustrations/anunciacao.svg')
    document.getElementById('data').textContent = p.data
    document.getElementById('hora').textContent = p.hora
    document.getElementById('lista').innerHTML = (p.notificacoes || []).slice(0, 3).map((n) => `
      <div class="notificacao">
        <div class="cabeca">${ICONE_GUIA}<span class="app">Guia do Advento</span><span class="tempo">${esc(n.tempo || 'agora')}</span></div>
        <div class="titulo">${esc(n.titulo)}</div>
        <div class="corpo">${esc(n.corpo)}</div>
      </div>`).join('')
    document.body.insertAdjacentHTML('beforeend', selo('claro'))
  }
  window.ajustar = () => caberComZoom(document.getElementById('tela'), 2.5, 1.9)
</script>
</body>
</html>
