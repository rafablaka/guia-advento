<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bloco de notas</title>
<link rel="stylesheet" href="base.css">
<style>
  :root { --fundo: #FFFFFF; --texto: #000; --vazio: #C4C4C8; --barra: rgba(249, 249, 249, 0.94); --linha: rgba(60, 60, 67, 0.18); }
  html[data-modo='escuro'] { --fundo: #000000; --texto: #fff; --vazio: #5A5A5F; --barra: rgba(22, 22, 24, 0.94); --linha: rgba(84, 84, 88, 0.6); }

  body { background: var(--fundo); color: var(--texto); }
  .tela { zoom: 2.4; width: 450px; height: 450px; display: flex; flex-direction: column; overflow: hidden; }

  .status { height: 50px; flex-shrink: 0; padding: 0 28px 0 38px; display: flex; align-items: center; justify-content: space-between; }
  .status .relogio { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .status .icones { display: flex; gap: 6px; align-items: center; }
  .status svg { fill: var(--texto); }

  .nav { height: 44px; flex-shrink: 0; padding: 0 16px 0 8px; display: flex; align-items: center; justify-content: space-between; color: var(--roxo); }
  .voltar { display: flex; align-items: center; gap: 4px; font-size: 17px; }
  .voltar svg { width: 12px; height: 21px; }
  .nav .acoes { display: flex; align-items: center; gap: 22px; }
  .nav svg { stroke: var(--roxo); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  .nota { flex: 1; min-height: 0; padding: 6px 20px 0; }
  .titulo { font-size: 28px; font-weight: 700; line-height: 1.18; letter-spacing: -0.01em; margin-bottom: 8px; }
  .item { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; font-size: 17px; line-height: 23px; }
  .bolinha { width: 22px; height: 22px; margin-top: 0.5px; border-radius: 50%; border: 1.5px solid var(--vazio); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .bolinha.marcado { border: 0; background: var(--roxo); }
  .bolinha svg { width: 12px; height: 12px; }
  .livre { margin-top: 14px; font-size: 17px; line-height: 23px; white-space: pre-wrap; }

  .reserva-selo { height: 34px; }
  .barra { flex-shrink: 0; background: var(--barra); border-top: 0.5px solid var(--linha); }
  .ferramentas { height: 48px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; }
  .ferramentas svg { stroke: var(--roxo); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; width: 25px; height: 25px; }
  .indicador { height: 26px; display: flex; justify-content: center; align-items: flex-start; padding-top: 10px; }
  .indicador span { width: 136px; height: 5px; border-radius: 3px; background: var(--texto); }
</style>
</head>
<body data-template="notas">
<div class="tela" id="tela">
  <div class="status">
    <span class="relogio">9:41</span>
    <span class="icones">
      <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="5" y="5" width="3" height="6" rx=".8"/><rect x="10" y="2.5" width="3" height="8.5" rx=".8"/><rect x="15" y="0" width="3" height="11" rx=".8"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.3c2.2 0 4.2.9 5.7 2.3l1.1-1.1C13 1.7 10.6.7 8 .7S3 1.7 1.2 3.5l1.1 1.1C3.8 3.2 5.8 2.3 8 2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1C11.3 4.6 9.7 3.9 8 3.9s-3.3.7-4.5 1.8l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L8 10.4 6.8 9.2c.3-.3.7-.5 1.2-.5z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2.4"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".4"/></svg>
    </span>
  </div>
  <div class="nav">
    <span class="voltar"><svg viewBox="0 0 12 21"><path d="M10 2 2 10.5 10 19" stroke-width="2.6"/></svg>Notas</span>
    <span class="acoes">
      <!-- compartilhar -->
      <svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 2v14M6.5 6.5 11 2l4.5 4.5M7.5 10H4.5A1.5 1.5 0 0 0 3 11.5v11A1.5 1.5 0 0 0 4.5 24h13a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 17.5 10h-3"/></svg>
      <!-- mais -->
      <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11"/><circle cx="8" cy="13" r=".9" fill="currentColor"/><circle cx="13" cy="13" r=".9" fill="currentColor"/><circle cx="18" cy="13" r=".9" fill="currentColor"/></svg>
    </span>
  </div>
  <div class="nota" id="nota"></div>
  <div class="barra">
    <div class="ferramentas">
      <!-- checklist -->
      <svg viewBox="0 0 25 25"><circle cx="12.5" cy="12.5" r="10.5"/><path d="m8 12.8 3 3 6-6.4"/></svg>
      <!-- anexo -->
      <svg viewBox="0 0 25 25"><path d="M17.5 11.5 11 18a4 4 0 0 1-5.7-5.7l7.4-7.4a2.7 2.7 0 0 1 3.8 3.8l-7.3 7.3a1.3 1.3 0 0 1-1.9-1.9l6.5-6.5"/></svg>
      <!-- marcação -->
      <svg viewBox="0 0 25 25"><circle cx="12.5" cy="12.5" r="10.5"/><path d="m9 16.5.6-2.6 5.6-5.6a1.4 1.4 0 0 1 2 2l-5.6 5.6L9 16.5z"/></svg>
      <!-- nova nota -->
      <svg viewBox="0 0 25 25"><path d="M11 4H6a2.5 2.5 0 0 0-2.5 2.5v12.5A2.5 2.5 0 0 0 6 21.5h12.5A2.5 2.5 0 0 0 21 19v-5"/><path d="M19.2 3.3a1.7 1.7 0 0 1 2.5 2.5L13 14.5l-3.3.8.8-3.3 8.7-8.7z"/></svg>
    </div>
    <div class="indicador"><span></span></div>
  </div>
</div>
<script src="base.js"></script>
<script>
  const CHECK = '<svg viewBox="0 0 12 12"><path d="M2.3 6.3 4.9 8.8 9.8 3.3" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>'

  window.render = (p, modo) => {
    const itens = (p.itens || []).map((i) => `
      <div class="item"><span class="bolinha ${i.marcado ? 'marcado' : ''}">${i.marcado ? CHECK : ''}</span><span>${esc(i.texto)}</span></div>`).join('')
    document.getElementById('nota').innerHTML = `
      <div class="titulo">${esc(p.titulo)}</div>
      ${itens}
      ${p.texto_livre ? `<div class="livre">${esc(p.texto_livre)}</div>` : ''}
      <div class="reserva-selo"></div>`
    document.body.insertAdjacentHTML('beforeend', selo(modo === 'escuro' ? 'claro' : 'escuro'))
  }
  // Nota longa: diminui o zoom até tudo caber acima da barra de ferramentas.
  window.ajustar = () => {
    const tela = document.getElementById('tela')
    const nota = document.getElementById('nota')
    for (let z = 2.4; z >= 1.8; z -= 0.05) {
      caberComZoom(tela, z, z)
      if (nota.scrollHeight <= nota.clientHeight + 1) break
    }
    // selo logo acima da barra de ferramentas, na faixa livre do fim da nota
    const barra = document.querySelector('.barra').getBoundingClientRect()
    document.querySelector('.selo').style.bottom = `${1080 - barra.top + 14}px`
  }
</script>
</body>
</html>
