<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conversa de grupo</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Cores do WhatsApp no iOS */
  :root {
    --topo: rgba(246, 246, 246, 0.97); --linha: rgba(0, 0, 0, 0.12); --icone: #000;
    --fundo: #EFE7DE; --desenho-opacidade: 0.07; --desenho-filtro: none;
    --recebida: #FFFFFF; --enviada: #D9FDD3; --texto: #111B21; --texto-2: #667781; --hora: #667781;
    --previa: rgba(0, 0, 0, 0.045); --link: #027EB5; --chip: rgba(255, 255, 255, 0.92); --chip-texto: #54656F;
    --campo: #FFFFFF; --campo-borda: rgba(0, 0, 0, 0.12); --sombra: rgba(11, 20, 26, 0.13);
  }
  html[data-modo='escuro'] {
    --topo: rgba(18, 24, 28, 0.97); --linha: rgba(255, 255, 255, 0.1); --icone: #fff;
    --fundo: #0B141A; --desenho-opacidade: 0.06; --desenho-filtro: invert(1);
    --recebida: #202C33; --enviada: #005C4B; --texto: #E9EDEF; --texto-2: #8696A0; --hora: rgba(233, 237, 239, 0.6);
    --previa: rgba(0, 0, 0, 0.18); --link: #53BDEB; --chip: #182229; --chip-texto: #8696A0;
    --campo: #2A3942; --campo-borda: transparent; --sombra: rgba(0, 0, 0, 0.25);
  }

  body { background: var(--fundo); color: var(--texto); }
  .tela { zoom: 2.25; width: 480px; height: 480px; display: flex; flex-direction: column; overflow: hidden; position: relative; }

  .topo { flex-shrink: 0; background: var(--topo); border-bottom: 0.5px solid var(--linha); position: relative; z-index: 2; }
  .status { height: 46px; padding: 0 30px 0 40px; display: flex; align-items: center; justify-content: space-between; color: var(--icone); }
  .status .relogio { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .status .icones { display: flex; gap: 6px; align-items: center; }
  .status svg { fill: currentColor; }
  .cabecalho { height: 52px; padding: 0 16px 6px 8px; display: flex; align-items: center; gap: 8px; color: var(--icone); }
  .cabecalho .voltar { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .foto { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: #DFE5E7; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  html[data-modo='escuro'] .foto { background: #6A7175; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .grupo { flex: 1; min-width: 0; margin-left: 2px; }
  .grupo .nome { font-size: 16.5px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grupo .dica { font-size: 12.5px; line-height: 16px; color: var(--texto-2); }
  .cabecalho .acoes { display: flex; gap: 26px; align-items: center; }
  .cabecalho .acoes svg { stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }

  .conversa { flex: 1; min-height: 0; position: relative; padding: 10px 14px 8px; display: flex; flex-direction: column; gap: 2px; }
  .reserva-selo { height: 38px; flex-shrink: 0; }
  .conversa::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background: url('../imagens/whatsapp-desenhos.svg') 0 0 / 200px 200px;
    opacity: var(--desenho-opacidade); filter: var(--desenho-filtro);
  }
  .dia { align-self: center; margin-top: auto; margin-bottom: 8px; padding: 4px 10px; border-radius: 8px; background: var(--chip); color: var(--chip-texto); font-size: 12.5px; font-weight: 500; box-shadow: 0 1px 0.5px var(--sombra); }

  .msg { position: relative; max-width: 78%; padding: 6px 8px 7px 9px; border-radius: 8px; font-size: 16px; line-height: 21px; box-shadow: 0 1px 0.5px var(--sombra); overflow-wrap: anywhere; }
  .msg.recebida { align-self: flex-start; background: var(--recebida); }
  .msg.enviada { align-self: flex-end; background: var(--enviada); }
  .msg.primeira { margin-top: 6px; }
  .msg.primeira.recebida { border-top-left-radius: 0; }
  .msg.primeira.enviada { border-top-right-radius: 0; }
  .cauda { position: absolute; top: 0; width: 8px; height: 13px; }
  .recebida .cauda { left: -8px; fill: var(--recebida); }
  .enviada .cauda { right: -8px; fill: var(--enviada); }
  .remetente { font-size: 13.5px; font-weight: 600; line-height: 18px; margin-bottom: 1px; }
  .rodape { float: right; display: flex; align-items: center; gap: 3px; margin: 7px 0 -4px 10px; font-size: 11px; line-height: 15px; color: var(--hora); }
  .rodape svg { width: 16px; height: 11px; fill: #53BDEB; }

  /* Prévia de link compacta (miniatura à esquerda), como o WhatsApp mostra imagens quadradas */
  .previa { margin: 2px -4px 6px -5px; border-radius: 6px; overflow: hidden; background: var(--previa); display: flex; align-items: stretch; }
  .previa .imagem { width: 84px; flex-shrink: 0; background: #1B1224; display: flex; align-items: center; justify-content: center; }
  .previa .imagem img { width: 78px; }
  .previa .info { padding: 8px 10px 9px; min-width: 0; }
  .previa .titulo { font-size: 14.5px; font-weight: 600; line-height: 19px; }
  .previa .descricao { font-size: 13px; line-height: 17px; color: var(--texto-2); }
  .previa .dominio { font-size: 12.5px; line-height: 17px; color: var(--texto-2); margin-top: 2px; }
  .link { color: var(--link); }

  .entrada { flex-shrink: 0; background: var(--topo); border-top: 0.5px solid var(--linha); color: var(--icone); position: relative; z-index: 2; }
  .entrada .linha { height: 50px; padding: 0 16px; display: flex; align-items: center; gap: 14px; }
  .entrada svg { stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .entrada .campo { flex: 1; height: 34px; border-radius: 17px; background: var(--campo); border: 0.5px solid var(--campo-borda); display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; }
  .entrada .indicador { height: 22px; display: flex; justify-content: center; padding-top: 6px; }
  .entrada .indicador span { width: 136px; height: 5px; border-radius: 3px; background: var(--icone); }
</style>
</head>
<body data-template="whatsapp">
<div class="tela" id="tela">
  <div class="topo">
    <div class="status">
      <span class="relogio">9:41</span>
      <span class="icones">
        <svg width="18" height="11" viewBox="0 0 18 11"><rect x="0" y="7" width="3" height="4" rx=".8"/><rect x="5" y="5" width="3" height="6" rx=".8"/><rect x="10" y="2.5" width="3" height="8.5" rx=".8"/><rect x="15" y="0" width="3" height="11" rx=".8"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 2.3c2.2 0 4.2.9 5.7 2.3l1.1-1.1C13 1.7 10.6.7 8 .7S3 1.7 1.2 3.5l1.1 1.1C3.8 3.2 5.8 2.3 8 2.3zm0 3.2c1.3 0 2.5.5 3.4 1.3l1.1-1.1C11.3 4.6 9.7 3.9 8 3.9s-3.3.7-4.5 1.8l1.1 1.1c.9-.8 2.1-1.3 3.4-1.3zm0 3.2c.5 0 .9.2 1.2.5L8 10.4 6.8 9.2c.3-.3.7-.5 1.2-.5z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2.4"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".4"/></svg>
      </span>
    </div>
    <div class="cabecalho">
      <svg class="voltar" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg>
      <div class="foto" id="foto"></div>
      <div class="grupo"><div class="nome" id="nome"></div><div class="dica">toque para dados do grupo</div></div>
      <div class="acoes">
        <svg width="26" height="18" viewBox="0 0 26 18"><rect x="1" y="2" width="16" height="14" rx="3.5"/><path d="M17 7.5l7-4v11l-7-4z"/></svg>
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6.6 2.5h2.6l1.6 4.6-2.3 1.6a12.5 12.5 0 0 0 6.8 6.8l1.6-2.3 4.6 1.6v2.6a2 2 0 0 1-2.2 2C10.7 18.8 5.2 13.3 4.6 4.7a2 2 0 0 1 2-2.2z"/></svg>
      </div>
    </div>
  </div>
  <div class="conversa" id="conversa"></div>
  <div class="entrada">
    <div class="linha">
      <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 3v16M3 11h16"/></svg>
      <div class="campo"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M17.5 10A7.5 7.5 0 1 1 10 2.5h5a2.5 2.5 0 0 1 2.5 2.5z"/><path d="M7 11.8c1.5 1.6 4.5 1.6 6 0"/><circle cx="7.5" cy="8" r=".6" fill="currentColor"/><circle cx="12.5" cy="8" r=".6" fill="currentColor"/></svg></div>
      <svg width="24" height="20" viewBox="0 0 24 20"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h2l1.5-2.5h6L16.5 4h2A2.5 2.5 0 0 1 21 6.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 15.5z"/><circle cx="12" cy="10.5" r="4"/></svg>
      <svg width="18" height="24" viewBox="0 0 18 24"><rect x="5" y="2" width="8" height="13" rx="4"/><path d="M2 11a7 7 0 0 0 14 0M9 18v4"/></svg>
    </div>
    <div class="indicador"><span></span></div>
  </div>
</div>
<script src="base.js"></script>
<script>
  // Cores dos nomes no grupo (claro, escuro). "roxo" é o roxo da marca.
  const CORES = {
    roxo: ['#553070', '#74508B'],
    laranja: ['#C4581C', '#FF8D50'],
    azul: ['#1F6FD1', '#53BDEB'],
    verde: ['#0A8A64', '#06CF9C'],
    rosa: ['#C9306A', '#FF72A1'],
    vinho: ['#A22B49', '#FF8296'],
  }
  const corDoNome = (cor, modo) => (CORES[cor] ? CORES[cor][modo === 'escuro' ? 1 : 0] : cor || 'inherit')
  const CAUDA_ESQ = '<svg class="cauda" viewBox="0 0 8 13"><path d="M8 0H1.5C.4 0-.3 1.2.3 2.1L8 13z"/></svg>'
  const CAUDA_DIR = '<svg class="cauda" viewBox="0 0 8 13"><path d="M0 0h6.5c1.1 0 1.8 1.2 1.2 2.1L0 13z"/></svg>'
  const TICKS = '<svg viewBox="0 0 16 11"><path d="M11.1.6 4.8 7.9 2 5.3.9 6.5l4 3.7L12.3 1.7zm3.8 0L8.6 7.9l-.9-.8-1.1 1.2 2.1 1.9L16 1.7z"/></svg>'
  const IMAGEM = /\.(png|jpe?g|webp|svg|gif)$/i

  const linkify = (t) => esc(t).replace(/(https?:\/\/\S+|\b[\w-]+(\.[\w-]+)+\.?\w*\/?\S*)/g, '<span class="link">$1</span>')

  window.render = (p, modo) => {
    const foto = document.getElementById('foto')
    if (p.foto_grupo && IMAGEM.test(p.foto_grupo)) foto.innerHTML = `<img src="${img(p.foto_grupo)}" alt="">`
    else if (p.foto_grupo) foto.textContent = p.foto_grupo
    else foto.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="9" cy="8" r="3.5"/><circle cx="16.5" cy="9" r="2.6"/><path d="M2.5 19c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6zM16 19c0-2-.6-3.7-1.7-5 .7-.3 1.4-.4 2.2-.4 2.7 0 5 1.9 5 5.4z"/></svg>'
    document.getElementById('nome').textContent = p.nome_grupo

    let anterior = null
    const html = (p.mensagens || []).map((m) => {
      const lado = m.enviada ? 'enviada' : 'recebida'
      const chave = m.enviada ? '__eu__' : m.remetente
      const primeira = chave !== anterior
      anterior = chave
      const nome = !m.enviada && primeira ? `<div class="remetente" style="color:${corDoNome(m.cor, modo)}">${esc(m.remetente)}</div>` : ''
      const l = m.link_preview
      const previa = l ? `
        <div class="previa">
          ${l.imagem ? `<div class="imagem" ${l.fundo ? `style="background:${esc(l.fundo)}"` : ''}><img src="${img(l.imagem)}" alt=""></div>` : ''}
          <div class="info">
            <div class="titulo">${esc(l.titulo)}</div>
            ${l.descricao ? `<div class="descricao">${esc(l.descricao)}</div>` : ''}
            ${l.dominio ? `<div class="dominio">${esc(l.dominio)}</div>` : ''}
          </div>
        </div>` : ''
      return `
        <div class="msg ${lado} ${primeira ? 'primeira' : ''}">
          ${primeira ? (m.enviada ? CAUDA_DIR : CAUDA_ESQ) : ''}
          ${nome}${previa}
          <span class="corpo">${linkify(m.texto)}</span>
          <span class="rodape">${esc(m.hora)}${m.enviada ? TICKS : ''}</span>
        </div>`
    }).join('')
    document.getElementById('conversa').innerHTML = `<div class="dia">${esc(p.dia || 'Hoje')}</div>${html}<div class="reserva-selo"></div>`
    document.body.insertAdjacentHTML('beforeend', selo(modo === 'escuro' ? 'claro' : 'escuro'))
  }

  // Conversa longa: diminui o zoom até as mensagens caberem.
  window.ajustar = () => {
    const tela = document.getElementById('tela')
    const conversa = document.getElementById('conversa')
    for (let z = 2.25; z >= 1.5; z -= 0.05) {
      caberComZoom(tela, z, z)
      if (conversa.scrollHeight <= conversa.clientHeight + 1) break
    }
    // selo logo acima da barra de digitação, na faixa livre do fim da conversa
    const entrada = document.querySelector('.entrada').getBoundingClientRect()
    document.querySelector('.selo').style.bottom = `${1080 - entrada.top + 14}px`
  }
</script>
</body>
</html>
